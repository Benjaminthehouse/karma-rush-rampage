<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karma Mash</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="splash">
    <div id="splash">
      <div class="splash-left">
        <div class="logo"><span>KARMA</span><span>MASH</span></div>
        <p class="tag" id="s-day">Five rounds. Three buttons. One shot a day.</p>
        <div class="chips" id="s-lineup"></div>
        <button id="s-play" class="play-btn">PLAY</button>
        <p class="me" id="s-me"></p>
      </div>
      <div class="splash-right">
        <h3 id="s-board-title">Today’s top mashers</h3>
        <ol class="standings" id="s-board"></ol>
        <p class="feed" id="s-feed"></p>
      </div>
    </div>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>

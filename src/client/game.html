<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Karma Rush Rampage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <main>
        <section id="menu" class="screen ui">
          <div class="logo"><span>KARMA</span><span>RUSH</span><span>RAMPAGE</span></div>
          <p class="tag" id="menu-day">Five rounds. Three buttons. One shot a day.</p>
          <p class="hint" id="menu-count"></p>
          <div class="chips" id="menu-lineup"></div>
          <div class="choices">
            <button class="choice c-green" data-pad="1">
              <b id="menu-daily">DAILY RUN</b><small id="menu-daily-sub">Counts for today’s leaderboard</small>
            </button>
            <button class="choice c-blue" data-pad="2">
              <b>LIVE PARTY</b><small>Race everyone on this post, in sync</small>
            </button>
            <button class="choice c-red" data-pad="0">
              <b>PRACTICE</b><small>Random games, nothing at stake</small>
            </button>
          </div>
          <p class="me" id="menu-me"></p>
        </section>

        <section id="lobby" class="screen ui" hidden>
          <h2>Live Party</h2>
          <p class="tag" id="lobby-status">Finding the lobby…</p>
          <ol class="standings" id="lobby-players"></ol>
          <p class="hint">Everyone here plays the same five games at the same moment.</p>
        </section>

        <section id="play" class="screen" hidden>
          <header class="hud">
            <div id="pips"></div>
            <div id="hud-title"></div>
            <div class="hud-right"><span id="combo"></span><span id="hud-score">0</span></div>
          </header>
          <div id="timebar"><i></i></div>
          <div class="arena" id="arena">
            <div id="stage"></div>
            <div id="card" class="ui" hidden></div>
            <div id="fx" class="fx-layer"></div>
          </div>
        </section>

        <section id="final" class="screen ui" hidden>
          <div class="eyebrow" id="final-kind"></div>
          <div class="total"><b id="final-total">0</b><span>/ 5,000</span></div>
          <div class="verdict" id="final-verdict"></div>
          <div class="badges" id="final-badges"></div>
          <ul class="breakdown" id="final-rounds"></ul>
          <h3 id="final-board-title"></h3>
          <ol class="standings" id="final-board"></ol>
        </section>

        <div id="settings">
          <button data-set="sound"></button>
          <button data-set="voice"></button>
          <button data-set="fx"></button>
        </div>
        <div id="fxg" class="fx-layer"></div>
        <div id="toast" hidden></div>
      </main>

      <footer id="pads">
        <button class="pad c-red" data-pad="0"><kbd>A</kbd><span></span></button>
        <button class="pad c-green" data-pad="1"><kbd>S</kbd><span></span></button>
        <button class="pad c-blue" data-pad="2"><kbd>D</kbd><span></span></button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
